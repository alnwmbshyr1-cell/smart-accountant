apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-webhook-worker
  labels:
    app.kubernetes.io/name: security-webhook-worker
    app.kubernetes.io/part-of: smart-accountant
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-webhook-worker
  labels:
    app.kubernetes.io/name: security-webhook-worker
    app.kubernetes.io/part-of: smart-accountant
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: security-webhook-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: security-webhook-worker
        app.kubernetes.io/part-of: smart-accountant
    spec:
      serviceAccountName: security-webhook-worker
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: ghcr.io/alnwmbshyr1-cell/smart-accountant-backend:stable
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "backend.ops.security_webhook_worker"]
          env:
            - name: REDIS_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: smart-accountant-redis
                  key: REDIS_ADDRESS
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-accountant-redis
                  key: REDIS_PASSWORD
            - name: REDIS_TLS
              value: "true"
          ports:
            - name: metrics
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: security-webhook-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: security-webhook-worker
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: security-webhook-worker-redis
spec:
  secretTargetRef:
    - parameter: address
      name: smart-accountant-redis
      key: REDIS_ADDRESS
    - parameter: password
      name: smart-accountant-redis
      key: REDIS_PASSWORD
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: security-webhook-worker
  labels:
    app.kubernetes.io/name: security-webhook-worker
    app.kubernetes.io/part-of: smart-accountant
spec:
  scaleTargetRef:
    name: security-webhook-worker
  pollingInterval: 15
  cooldownPeriod: 300
  initialCooldownPeriod: 60
  minReplicaCount: 2
  maxReplicaCount: 20
  idleReplicaCount: 0
  fallback:
    failureThreshold: 3
    replicas: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
            - type: Pods
              value: 4
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
          selectPolicy: Min
  triggers:
    - type: redis-streams
      metadata:
        addressFromEnv: REDIS_ADDRESS
        stream: security:webhook:events
        consumerGroup: security-webhook-workers
        pendingEntriesCount: "100"
        activationPendingEntriesCount: "10"
        enableTLS: "true"
      authenticationRef:
        name: security-webhook-worker-redis
