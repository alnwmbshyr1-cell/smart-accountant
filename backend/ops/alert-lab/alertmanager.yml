global:
  resolve_timeout: 10s
route:
  receiver: local-slack
  group_by: [alertname, category, testid]
  group_wait: 2s
  group_interval: 5s
  repeat_interval: 1h
receivers:
  - name: local-slack
    slack_configs:
      - api_url: http://receiver:8080/slack
        channel: '#local-alert-lab'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] local alert lab'
        text: >-
          {{ range .Alerts }}{{ .Labels.alertname }} ({{ .Labels.severity }})
          {{ .Annotations.summary }} testid={{ .Labels.testid }}{{ end }}
