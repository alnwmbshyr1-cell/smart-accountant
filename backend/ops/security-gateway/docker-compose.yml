services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - security_gateway_redis:/data

  gateway:
    build:
      context: ../../../
      dockerfile: backend/ops/security-gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "8443:8443"
    environment:
      REDIS_URL: redis://redis:6379/0
      GATEWAY_PORT: "8443"
      GATEWAY_INGRESS_TOKEN: ${GATEWAY_INGRESS_TOKEN:?set GATEWAY_INGRESS_TOKEN}
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-86400}
      TLS_CERT_FILE: /run/tls/cert.pem
      TLS_KEY_FILE: /run/tls/key.pem
      FORWARD_SLACK_WEBHOOK_URL: ${FORWARD_SLACK_WEBHOOK_URL:-}
      FORWARD_EMAIL_WEBHOOK_URL: ${FORWARD_EMAIL_WEBHOOK_URL:-}
      FORWARD_EMAIL_WEBHOOK_TOKEN: ${FORWARD_EMAIL_WEBHOOK_TOKEN:-}
    volumes:
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR}:/run/tls:ro

volumes:
  security_gateway_redis:
