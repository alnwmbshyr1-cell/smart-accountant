global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/tests/local-5xx-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: smart-accountant-backend
    metrics_path: /metrics
    static_configs:
      - targets: [metrics-fixture:8080]
