global:
  resolve_timeout: 5m
  # Mount the Slack incoming webhook URL as a secret file. Never inline it.
  slack_api_url_file: /etc/alertmanager/secrets/slack_webhook_url

route:
  receiver: smart-accountant-slack
  group_by: [alertname, job, severity, category]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - alertname="CircuitBreakerOpen"
      receiver: smart-accountant-circuit-pagerduty
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 30m
      continue: true
    - matchers:
        - alertname="CircuitBreakerOpen"
      receiver: smart-accountant-circuit-webhook
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 30m
      continue: true
    - matchers:
        - category="security"
      receiver: smart-accountant-security-webhook
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1h
      continue: true
    - matchers:
        - category="database"
        - severity="critical"
      receiver: smart-accountant-critical
      continue: true
    - matchers:
        - category="staging"
      receiver: smart-accountant-slack
      continue: false
    - matchers:
        - category="load_test"
      receiver: smart-accountant-slack
      continue: false
    - matchers:
        - severity="critical"
      receiver: smart-accountant-critical
      continue: true
    - matchers:
        - severity="high"
      receiver: smart-accountant-ops-webhook
      continue: true

receivers:
  - name: smart-accountant-slack
    slack_configs:
      - channel: "#smart-accountant-alerts"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] Smart Accountant alert"
        text: >-
          {{ range .Alerts }}
          *{{ .Labels.alertname }}* ({{ .Labels.severity }})
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ if .Annotations.runbook }}Runbook: {{ .Annotations.runbook }}{{ end }}
          {{ end }}

  - name: smart-accountant-critical
    slack_configs:
      - channel: "#smart-accountant-critical"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] CRITICAL Smart Accountant alert"
        text: >-
          {{ range .Alerts }}
          *{{ .Labels.alertname }}*
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ if .Annotations.runbook }}Runbook: {{ .Annotations.runbook }}{{ end }}
          {{ end }}

  - name: smart-accountant-ops-webhook
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/ops_webhook_url
        send_resolved: true

  - name: smart-accountant-security-webhook
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/security_webhook_url
        send_resolved: true
        max_alerts: 20

  - name: smart-accountant-circuit-pagerduty
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty_routing_key
        send_resolved: true
        severity: '{{ if eq .CommonLabels.severity "critical" }}critical{{ else }}warning{{ end }}'
        class: '{{ .CommonLabels.alertname }}'
        component: '{{ .CommonLabels.dependency }}'
        group: smart-accountant-circuit-breaker
        details:
          summary: '{{ .CommonAnnotations.summary }}'
          description: '{{ .CommonAnnotations.description }}'
          runbook: '{{ .CommonAnnotations.runbook }}'

  - name: smart-accountant-circuit-webhook
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/circuit_open_webhook_url
        send_resolved: true
        max_alerts: 10

inhibit_rules:
  - source_matchers:
      - alertname="SmartAccountantBackendDown"
    target_matchers:
      - severity=~"warning|high"
    equal: [job]
