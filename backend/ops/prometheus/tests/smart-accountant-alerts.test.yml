rule_files:
  - ../smart-accountant-alerts.yml

evaluation_interval: 30s

tests:
  # 10% errors are above the 5% threshold, but the alert is still pending
  # before the 10-minute `for` duration has elapsed.
  - interval: 30s
    input_series:
      - series: 'smart_accountant_http_requests_total{job="smart-accountant-backend",status_code="200"}'
        values: '0+100x40'
      - series: 'smart_accountant_http_requests_total{job="smart-accountant-backend",status_code="500"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: SmartAccountantHigh5xxRate
        exp_alerts: []

  # The same 10% error ratio stays active long enough to fire.
  - interval: 30s
    input_series:
      - series: 'smart_accountant_http_requests_total{job="smart-accountant-backend",status_code="200"}'
        values: '0+100x50'
      - series: 'smart_accountant_http_requests_total{job="smart-accountant-backend",status_code="500"}'
        values: '0+10x50'
    alert_rule_test:
      - eval_time: 12m
        alertname: SmartAccountantHigh5xxRate
        exp_alerts:
          - exp_labels:
              alertname: SmartAccountantHigh5xxRate
              severity: high

  # A 2% error ratio remains below the 5% threshold.
  - interval: 30s
    input_series:
      - series: 'smart_accountant_http_requests_total{job="smart-accountant-backend",status_code="200"}'
        values: '0+100x50'
      - series: 'smart_accountant_http_requests_total{job="smart-accountant-backend",status_code="500"}'
        values: '0+2x50'
    alert_rule_test:
      - eval_time: 12m
        alertname: SmartAccountantHigh5xxRate
        exp_alerts: []

  # The service recovers after firing; no active alert should remain.
  - interval: 30s
    input_series:
      - series: 'smart_accountant_http_requests_total{job="smart-accountant-backend",status_code="200"}'
        values: '0+100x20 2000+100x20'
      - series: 'smart_accountant_http_requests_total{job="smart-accountant-backend",status_code="500"}'
        values: '0+10x20 200+2x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: SmartAccountantHigh5xxRate
        exp_alerts:
          - exp_labels:
              alertname: SmartAccountantHigh5xxRate
              severity: high
      - eval_time: 20m
        alertname: SmartAccountantHigh5xxRate
        exp_alerts: []


  # p99 is above 500ms for four minutes only; the alert remains pending.
  - interval: 30s
    input_series:
      - series: 'smart_accountant_http_request_duration_seconds_bucket{job="smart-accountant-backend",route="/v1/security/notify",le="0.1"}'
        values: '0+0x30'
      - series: 'smart_accountant_http_request_duration_seconds_bucket{job="smart-accountant-backend",route="/v1/security/notify",le="0.5"}'
        values: '0+10x30'
      - series: 'smart_accountant_http_request_duration_seconds_bucket{job="smart-accountant-backend",route="/v1/security/notify",le="1.0"}'
        values: '0+100x30'
      - series: 'smart_accountant_http_request_duration_seconds_bucket{job="smart-accountant-backend",route="/v1/security/notify",le="+Inf"}'
        values: '0+100x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: SmartAccountantHighP99Latency
        exp_alerts: []

  # The same route remains above 500ms long enough to fire.
  - interval: 30s
    input_series:
      - series: 'smart_accountant_http_request_duration_seconds_bucket{job="smart-accountant-backend",route="/v1/security/notify",le="0.1"}'
        values: '0+0x40'
      - series: 'smart_accountant_http_request_duration_seconds_bucket{job="smart-accountant-backend",route="/v1/security/notify",le="0.5"}'
        values: '0+10x40'
      - series: 'smart_accountant_http_request_duration_seconds_bucket{job="smart-accountant-backend",route="/v1/security/notify",le="1.0"}'
        values: '0+100x40'
      - series: 'smart_accountant_http_request_duration_seconds_bucket{job="smart-accountant-backend",route="/v1/security/notify",le="+Inf"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 6m
        alertname: SmartAccountantHighP99Latency
        exp_alerts:
          - exp_labels:
              alertname: SmartAccountantHighP99Latency
              severity: warning
              team: platform
              route: /v1/security/notify

  # A route whose p99 is exactly 500ms does not fire because the rule is strict > 0.5.
  - interval: 30s
    input_series:
      - series: 'smart_accountant_http_request_duration_seconds_bucket{job="smart-accountant-backend",route="/healthz",le="0.1"}'
        values: '0+0x40'
      - series: 'smart_accountant_http_request_duration_seconds_bucket{job="smart-accountant-backend",route="/healthz",le="0.5"}'
        values: '0+100x40'
      - series: 'smart_accountant_http_request_duration_seconds_bucket{job="smart-accountant-backend",route="/healthz",le="1.0"}'
        values: '0+100x40'
      - series: 'smart_accountant_http_request_duration_seconds_bucket{job="smart-accountant-backend",route="/healthz",le="+Inf"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 6m
        alertname: SmartAccountantHighP99Latency
        exp_alerts: []
