groups:
  - name: smart-accountant-backend
    interval: 30s
    rules:
      - alert: SmartAccountantBackendDown
        expr: up{job="smart-accountant-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Smart Accountant Backend is unreachable
          description: Prometheus has not scraped the backend successfully for 2 minutes.
          runbook: https://runbooks.example.com/smart-accountant/backend-down

      - alert: SmartAccountantHigh5xxRate
        expr: |
          sum(rate(smart_accountant_http_requests_total{job="smart-accountant-backend",status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(smart_accountant_http_requests_total{job="smart-accountant-backend"}[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: high
        annotations:
          summary: Smart Accountant backend 5xx rate is high
          description: More than 5% of backend requests returned 5xx for 10 minutes.
          runbook: https://runbooks.example.com/smart-accountant/high-5xx

      - alert: SmartAccountantGeminiFailures
        expr: rate(smart_accountant_gemini_failures_total{job="smart-accountant-backend"}[10m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Gemini upstream failures are increasing
          description: Gemini failures exceed 0.1 per second for 10 minutes; local fallback should remain available.
          runbook: https://runbooks.example.com/smart-accountant/gemini-upstream

      - alert: SmartAccountantHighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(smart_accountant_http_request_duration_seconds_bucket{job="smart-accountant-backend"}[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Smart Accountant backend p95 latency is high
          description: Backend p95 request latency exceeds 2 seconds for 10 minutes.
          runbook: https://runbooks.example.com/smart-accountant/latency

      - alert: SmartAccountantHighP99Latency
        expr: |
          histogram_quantile(0.99,
            sum by (route, le) (
              rate(smart_accountant_http_request_duration_seconds_bucket{job="smart-accountant-backend"}[5m])
            )
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: P99 latency is above 500ms for {{ $labels.route }}
          description: Endpoint {{ $labels.route }} has p99 request latency above 500ms continuously for 5 minutes.
          runbook: https://runbooks.example.com/smart-accountant/latency-p99

      - alert: SmartAccountantAuthFailureSpike
        expr: rate(smart_accountant_auth_failures_total{job="smart-accountant-backend"}[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Authentication failures have spiked
          description: JWT rejection rate exceeds 1 per second for 5 minutes; investigate abuse or client clock issues.
          runbook: https://runbooks.example.com/smart-accountant/auth-spike

      - alert: SmartAccountantDeadlockBurst
        expr: increase(smart_accountant_db_deadlocks_total{job="smart-accountant-backend"}[10m]) >= 5
        for: 1m
        labels:
          severity: critical
          category: database
        annotations:
          summary: Repeated database deadlocks detected
          description: At least 5 database deadlocks occurred in 10 minutes; payment writes may be retrying or contending.
          runbook: https://runbooks.example.com/smart-accountant/database-deadlocks

      - alert: SmartAccountantDeadlockRateHigh
        expr: rate(smart_accountant_db_deadlocks_total{job="smart-accountant-backend"}[5m]) > 0.1
        for: 5m
        labels:
          severity: high
          category: database
        annotations:
          summary: Database deadlock rate is high
          description: Database deadlocks exceed 0.1 per second for 5 minutes; inspect lock ordering, transaction duration, and retry exhaustion.
          runbook: https://runbooks.example.com/smart-accountant/database-deadlocks

      - alert: SmartAccountantStagingPaymentTestFailed
        expr: increase(smart_accountant_staging_test_failures_total{test="payment-idempotency",environment="staging"}[15m]) > 0
        for: 1m
        labels:
          severity: high
          category: staging
        annotations:
          summary: Payment Idempotency staging test failed
          description: A protected staging payment test failed in the last 15 minutes; inspect the exact GitHub Actions run before promotion.
          runbook: https://runbooks.example.com/smart-accountant/staging-payment-test

      - alert: SmartAccountantK6P95LatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (testid, le) (
              rate(k6_http_req_duration_seconds_bucket{testid!=""}[2m])
            )
          ) > 0.75
          and on (testid)
          sum by (testid) (rate(k6_http_reqs_total{testid!=""}[2m])) > 0
        for: 1m
        labels:
          severity: warning
          category: load_test
        annotations:
          summary: k6 p95 latency is above 750ms for {{ $labels.testid }}
          description: The active k6 run {{ $labels.testid }} has sustained p95 latency above 750ms for at least 1 minute.
          runbook: https://runbooks.example.com/smart-accountant/k6-p95

      - alert: SmartAccountantHighMemory
        expr: smart_accountant_process_rss_bytes{job="smart-accountant-backend"} > 536870912
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Smart Accountant backend RSS is above 512 MiB
          description: Process resident memory has exceeded the configured baseline.
          runbook: https://runbooks.example.com/smart-accountant/memory
