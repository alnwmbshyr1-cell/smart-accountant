name: Security review escalation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["Smart Accountant CI/CD"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write

jobs:
  detect-quality-failure:
    name: Detect quality gate failure
    runs-on: ubuntu-latest
    outputs:
      quality_failed: ${{ steps.detect.outputs.quality_failed }}
      pr_number: ${{ steps.detect.outputs.pr_number }}
      same_repo: ${{ steps.detect.outputs.same_repo }}
    steps:
      - name: Inspect required check runs
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const required = new Set([
              'Quality gate',
              'Fast checks',
              'Integration tests',
              'Full coverage',
              'SAST and dependency security',
              'Security scanning'
            ]);
            const run = context.payload.workflow_run;
            const pr = context.payload.pull_request || run?.pull_requests?.[0];
            const sha = context.payload.pull_request?.head?.sha || run?.head_sha || context.sha;
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              per_page: 100
            });
            const failed = data.check_runs
              .filter(check => required.has(check.name))
              .filter(check => ['failure', 'cancelled', 'timed_out', 'action_required'].includes(check.conclusion));
            const qualityFailed = failed.length > 0;
            const prNumber = pr?.number ? String(pr.number) : '';
            const sameRepo = pr?.head?.repo?.full_name === context.payload.repository?.full_name ? 'true' : 'false';
            core.setOutput('quality_failed', qualityFailed ? 'true' : 'false');
            core.setOutput('pr_number', prNumber);
            core.setOutput('same_repo', sameRepo);
            core.summary
              .addHeading('Security review escalation')
              .addRaw(qualityFailed ? `Failed checks: ${failed.map(check => check.name).join(', ')}` : 'No required quality/security check failure detected.')
              .write();

  request-security-review:
    name: Request security review
    needs: detect-quality-failure
    if: >-
      needs.detect-quality-failure.outputs.quality_failed == 'true' &&
      needs.detect-quality-failure.outputs.pr_number != '' &&
      needs.detect-quality-failure.outputs.same_repo == 'true' &&
      env.ACT_LOCAL != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Request configured security reviewer and add label
        uses: actions/github-script@v7
        env:
          SECURITY_TEAM_SLUG: ${{ vars.SECURITY_TEAM_SLUG }}
          SECURITY_REVIEWER: ${{ vars.SECURITY_REVIEWER }}
          PR_NUMBER: ${{ needs.detect-quality-failure.outputs.pr_number }}
        with:
          script: |
            const marker = '<!-- smart-accountant-security-review-required -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const team = (process.env.SECURITY_TEAM_SLUG || '').trim();
            const reviewer = (process.env.SECURITY_REVIEWER || context.repo.owner).trim();
            const request = team
              ? { team_reviewers: [team], reviewers: reviewer ? [reviewer] : [] }
              : { reviewers: [reviewer] };
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              ...request
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['security-review-required']
            });
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });
            const body = `${marker}\n## مراجعة أمنية مطلوبة\n\nفشل أحد فحوص الجودة أو الأمن المطلوبة. راجع تفاصيل **Quality gate** وCode Scanning، ولا تدمج التغيير قبل إصلاح السبب أو اعتماد استثناء موثق من فريق الأمن.`;
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body });
            }

  fork-safe-no-write:
    name: Fork PR safe no-write path
    needs: detect-quality-failure
    if: >-
      needs.detect-quality-failure.outputs.quality_failed == 'true' &&
      needs.detect-quality-failure.outputs.pr_number != '' &&
      needs.detect-quality-failure.outputs.same_repo != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Fork PR detected; no reviewer request, label, or comment is attempted.'
