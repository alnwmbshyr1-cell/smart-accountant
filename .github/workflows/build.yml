name: Build Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # هذا هو اللي كان ناقص عشان 403

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Install deps
        run: flutter pub get

      - name: Build APK split
        run: flutter build apk --split-per-abi --release

      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}  # ديناميكي v1.0.6
          name: Smart Accountant ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          body: |
            ## ${{ github.ref_name }} - المساعد الذكي للمحاسبة
            
            ### التغييرات
            - اصلاح مشكلة NDK و abiFilters
            - بناء تلقائي ناجح
            
            ### التحميل
            اختر الملف المناسب لجهازك:
            - arm64-v8a: لاغلب الجوالات الحديثة
            - armeabi-v7a: للجوالات القديمة
