name: Smart Accountant CI/CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  FLUTTER_VERSION: '3.27.1'
  PUB_CACHE: ${{ github.workspace }}/.pub-cache
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=true

concurrency:
  group: smart-accountant-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run formatting, analysis, unit, and widget checks
        run: ./tooling/ci_local.sh fast

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run integration workflows
        run: ./tooling/ci_local.sh integration
      - name: Upload integration logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ github.sha }}
          path: /tmp/*.log
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: Full coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run full suite and coverage gate
        run: ./tooling/ci_local.sh coverage
      - name: Generate coverage summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s coverage/lcov.info ]; then
            python3 tooling/report_coverage.py | tee /tmp/coverage-summary.txt
            {
              echo '## Coverage summary'
              echo
              sed -n '/^TOTAL/,$p' /tmp/coverage-summary.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage/lcov.info
            coverage/html/
            coverage/coverage_by_file.txt
            coverage/coverage_report_ar.md
          if-no-files-found: warn
          retention-days: 14

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: OSV dependency scan
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --lockfile=pubspec.lock
            --format=sarif
            --output=security/osv-results.sarif
      - name: Upload OSV SARIF
        if: always() && hashFiles('security/osv-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security/osv-results.sarif
          category: dart-dependencies
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [fast, integration, coverage, security]
    if: always()
    steps:
      - name: Require all quality jobs to pass
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          echo "fast=${FAST_RESULT}"
          echo "integration=${INTEGRATION_RESULT}"
          echo "coverage=${COVERAGE_RESULT}"
          echo "security=${SECURITY_RESULT}"
          test "$FAST_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$SECURITY_RESULT" = success

  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [quality]
    if: ${{ needs.quality.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --release; then exit 0; fi
            rm -rf android/.gradle android/build android/app/build
            sleep $((attempt * 20))
          done
          exit 1
      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: المحاسب الصوتي ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## المحاسب الصوتي - ${{ github.ref_name }}
            تم اجتياز fast وintegration وcoverage وsecurity قبل بناء APK.
