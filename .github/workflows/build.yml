name: Build Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Install deps
        run: flutter pub get

      - name: Build APK arm64-v8a release
        run: flutter build apk --release

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Smart Accountant ${{ github.ref_name }} - عاقل المحاسبة الخارق
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## ${{ github.ref_name }} - عاقل المحاسبة الخارق v2.0.6
            
            ### الميزات والتحديثات
            - ترقية بيئة البناء إلى Flutter 3.27.1 لدعم حزمة flutter_gemma و large_file_handler بالكامل.
            - تحميل نموذج Gemma محلياً عند التشغيل الأول عبر Dio.
            - بناء نظيف ومستقر 100%.
            
            ### التحميل
            - قم بتنزيل ملف `app-release.apk` وثبته على هاتفك.
