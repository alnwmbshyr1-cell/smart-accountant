name: Build Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'

      - name: Install deps
        run: flutter pub get

      - name: Build APK arm64-v8a release
        run: flutter build apk --release

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Smart Accountant ${{ github.ref_name }} - عاقل المحاسبة الخارق
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## ${{ github.ref_name }} - عاقل المحاسبة الخارق v2.0.5
            
            ### الميزات والتحديثات
            - توافق كامل مع Flutter 3.22.3 وflutter_gemma 0.1.9 وintl 0.19.0.
            - بناء نظيف ومستقر بدون تعارضات.
            
            ### التحميل
            - قم بتنزيل ملف `app-release.apk` وثبته على هاتفك.
