name: Smart Accountant CI/CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  FLUTTER_VERSION: '3.27.1'
  PUB_CACHE: ${{ github.workspace }}/.pub-cache
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=true

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run fast checks
        run: ./tooling/ci_local.sh fast

  full:
    name: Full tests, integration, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run full checks
        run: ./tooling/ci_local.sh full
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage/lcov.info
            coverage/html/
            performance/
          if-no-files-found: warn

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: OSV dependency scan
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --lockfile=pubspec.lock
            --format=sarif
            --output=security/osv-results.sarif
      - name: Upload OSV SARIF
        if: always() && hashFiles('security/osv-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security/osv-results.sarif
          category: dart-dependencies
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [fast, full, security]
    if: always()
    steps:
      - name: Require all quality jobs to pass
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          FULL_RESULT: ${{ needs.full.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          echo "fast=${FAST_RESULT}"
          echo "full=${FULL_RESULT}"
          echo "security=${SECURITY_RESULT}"
          test "$FAST_RESULT" = success
          test "$FULL_RESULT" = success
          test "$SECURITY_RESULT" = success

  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [quality]
    if: ${{ needs.quality.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --release; then exit 0; fi
            rm -rf android/.gradle android/build android/app/build
            sleep $((attempt * 20))
          done
          exit 1
      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: المحاسب الصوتي ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## المحاسب الصوتي - ${{ github.ref_name }}
            تم اجتياز الفحوصات السريعة والكاملة والأمنية قبل بناء APK.
