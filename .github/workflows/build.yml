name: Build Smart Accountant APK v1.0.5

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Code Analysis
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Release APK Split Per ABI
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-accountant-apks
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create GitHub Release v1.0.5
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.5
          name: "Smart Accountant v1.0.5 - المساعد الذكي"
          body: "مساعد صوتي محاسبي اوفلاين 100%. يتكلم ويفهم ويضيف ويحسب. يشمل قاعدة البيانات المحلية ai_agent_service و database_service ونموذج Vosk (تحديث تلقائي عند البناء الناجح)."
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
