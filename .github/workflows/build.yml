name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=true
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: .pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter pub get; then exit 0; fi
            echo "flutter pub get failed on attempt ${attempt}; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Build APK with Gradle network retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --release; then exit 0; fi
            echo "APK build failed on attempt ${attempt}; retrying after dependency/network recovery..."
            rm -rf android/.gradle android/build android/app/build
            sleep $((attempt * 20))
          done
          exit 1

      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: المحاسب الصوتي ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## المحاسب الصوتي - ${{ github.ref_name }}
            نموذج Vosk العربي يُحمّل عند أول تشغيل، ثم يعمل محلياً دون إنترنت.
