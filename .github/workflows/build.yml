name: Smart Accountant CI/CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  FLUTTER_VERSION: '3.27.1'
  PUB_CACHE: ${{ github.workspace }}/.pub-cache
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=true

concurrency:
  group: smart-accountant-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run formatting, analysis, unit, and widget checks
        run: ./tooling/ci_local.sh fast

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run integration workflows
        run: ./tooling/ci_local.sh integration
      - name: Upload integration logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ github.sha }}
          path: /tmp/*.log
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: Full coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run full suite and coverage gate
        run: ./tooling/ci_local.sh coverage

      - name: Generate coverage summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s coverage/lcov.info ]; then
            python3 tooling/report_coverage.py | tee /tmp/coverage-summary.txt
            {
              echo '## Coverage summary'
              echo
              sed -n '/^TOTAL/,$p' /tmp/coverage-summary.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage/lcov.info
            coverage/html/
            coverage/coverage_by_file.txt
            coverage/coverage_report_ar.md
          if-no-files-found: warn
          retention-days: 14

  prometheus-rules:
    name: Prometheus alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Prometheus alert rules with promtool
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/backend:/work:ro" \
            --workdir /work \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.5.0 \
            test rules ops/prometheus/tests/smart-accountant-alerts.test.yml
      - name: Validate Alertmanager configuration with amtool
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/backend:/work:ro" \
            --workdir /work \
            --entrypoint /bin/amtool \
            prom/alertmanager:v0.28.1 \
            check-config ops/alertmanager/alertmanager.yml
      - name: Validate local Compose topology
        run: docker compose -f backend/ops/alertmanager/docker-compose.yml config --quiet
      - name: Upload observability CI inputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: observability-ci-inputs-${{ github.sha }}
          path: |
            backend/ops/prometheus/
            backend/ops/alertmanager/
          if-no-files-found: warn
          retention-days: 7
  security:
    name: Security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: OSV dependency scan
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --lockfile=pubspec.lock
            --format=sarif
            --output=security/osv-results.sarif
      - name: Upload OSV SARIF
        if: always() && hashFiles('security/osv-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security/osv-results.sarif
          category: dart-dependencies
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  container-security:
    name: Trivy container and filesystem scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare security report directory
        run: mkdir -p security
      - name: Trivy filesystem vulnerability and secret report
        id: trivy_fs_report
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: security/trivy-fs.sarif
          vuln-type: os,library
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Upload Trivy filesystem SARIF
        if: always() && hashFiles('security/trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security/trivy-fs.sarif
          category: trivy-filesystem
      - name: Trivy Prometheus image report
        id: trivy_prometheus_report
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: prom/prometheus:v3.5.0
          format: sarif
          output: security/trivy-prometheus.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Upload Trivy Prometheus SARIF
        if: always() && hashFiles('security/trivy-prometheus.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security/trivy-prometheus.sarif
          category: trivy-prometheus-image
      - name: Trivy Alertmanager image report
        id: trivy_alertmanager_report
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: prom/alertmanager:v0.28.1
          format: sarif
          output: security/trivy-alertmanager.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Upload Trivy Alertmanager SARIF
        if: always() && hashFiles('security/trivy-alertmanager.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security/trivy-alertmanager.sarif
          category: trivy-alertmanager-image
      - name: Enforce Trivy policy
        if: steps.trivy_fs_report.outcome == 'failure' || steps.trivy_prometheus_report.outcome == 'failure' || steps.trivy_alertmanager_report.outcome == 'failure'
        run: exit 1
      - name: Upload Trivy reports on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports-${{ github.sha }}
          path: security/*.sarif
          if-no-files-found: ignore
          retention-days: 14

  snyk:
    name: Optional Snyk dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect Snyk availability
        id: snyk_token
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [[ -n "$SNYK_TOKEN" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'SNYK_TOKEN is not configured; skipping optional Snyk scan.'
          fi
      - name: Run Snyk Node dependency scan
        id: snyk_node
        if: steps.snyk_token.outputs.enabled == 'true'
        continue-on-error: true
        uses: snyk/actions/node@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=backend/package.json --severity-threshold=high --sarif-file-output=snyk-node.sarif
      - name: Upload Snyk SARIF
        if: always() && hashFiles('snyk-node.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-node.sarif
          category: snyk-node
      - name: Enforce Snyk policy
        if: steps.snyk_token.outputs.enabled == 'true' && steps.snyk_node.outcome == 'failure'
        run: exit 1
      - name: Upload Snyk report on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-reports-${{ github.sha }}
          path: snyk-node.sarif
          if-no-files-found: ignore
          retention-days: 14

  security-report:
    name: Unified security report
    runs-on: ubuntu-24.04
    needs: [container-security, snyk]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Trivy reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: trivy-reports-${{ github.sha }}
          path: security-inputs
          merge-multiple: true
      - name: Download Snyk reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: snyk-reports-${{ github.sha }}
          path: security-inputs
          merge-multiple: true
      - name: Generate unified report
        run: |
          mkdir -p security-report
          python3 tooling/merge_security_reports.py \
            --input trivy-fs=security-inputs/security/trivy-fs.sarif \
            --input trivy-prometheus=security-inputs/security/trivy-prometheus.sarif \
            --input trivy-alertmanager=security-inputs/security/trivy-alertmanager.sarif \
            --input snyk-node=security-inputs/snyk-node.sarif \
            --json-output security-report/security-report.json \
            --markdown-output security-report/security-report.md \
            | tee security-report/summary.json
      - name: Add report to workflow summary
        if: always() && hashFiles('security-report/security-report.md') != ''
        run: cat security-report/security-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unified security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-security-report-${{ github.sha }}
          path: security-report/
          if-no-files-found: error
          retention-days: 30

  security-notify:
    name: Critical security notifications
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [security-report]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download unified report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: unified-security-report-${{ github.sha }}
          path: unified-report
      - name: Evaluate Critical findings
        id: evaluate
        shell: bash
        run: |
          set -euo pipefail
          report="unified-report/security-report.json"
          if [ ! -s "$report" ]; then
            echo 'critical_count=0' >> "$GITHUB_OUTPUT"
            echo 'Unified report is unavailable; the security-report job result remains authoritative.'
            exit 0
          fi
          critical_count=$(python3 - "$report" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              report = json.load(handle)
          findings = report.get('findings', [])
          print(sum(1 for item in findings if isinstance(item, dict) and item.get('severity') == 'critical'))
          PY
          )
          echo "critical_count=$critical_count" >> "$GITHUB_OUTPUT"
          echo "Critical findings: $critical_count"
      - name: Materialize gateway mTLS certificates
        if: steps.evaluate.outputs.critical_count != '0'
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.SECURITY_GATEWAY_WEBHOOK_URL }}
          GATEWAY_CA_B64: ${{ secrets.SECURITY_GATEWAY_CA_B64 }}
          GATEWAY_CLIENT_CERT_B64: ${{ secrets.SECURITY_GATEWAY_CLIENT_CERT_B64 }}
          GATEWAY_CLIENT_KEY_B64: ${{ secrets.SECURITY_GATEWAY_CLIENT_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$GATEWAY_URL" ]; then
            echo 'Security Gateway URL is not configured; keeping direct notification channels.'
            exit 0
          fi
          test -n "$GATEWAY_CA_B64"
          test -n "$GATEWAY_CLIENT_CERT_B64"
          test -n "$GATEWAY_CLIENT_KEY_B64"
          printf '%s' "$GATEWAY_CA_B64" | base64 --decode > "$RUNNER_TEMP/security-gateway-ca.pem"
          printf '%s' "$GATEWAY_CLIENT_CERT_B64" | base64 --decode > "$RUNNER_TEMP/security-gateway-client.crt"
          printf '%s' "$GATEWAY_CLIENT_KEY_B64" | base64 --decode > "$RUNNER_TEMP/security-gateway-client.key"
          chmod 600 "$RUNNER_TEMP/security-gateway-client.key"
      - name: Notify Security Gateway, Slack, or email
        if: steps.evaluate.outputs.critical_count != '0'
        continue-on-error: false
        env:
          SECURITY_SLACK_WEBHOOK_URL: ${{ secrets.SECURITY_SLACK_WEBHOOK_URL }}
          SECURITY_OPS_WEBHOOK_URL: ${{ secrets.SECURITY_OPS_WEBHOOK_URL }}
          SECURITY_GATEWAY_WEBHOOK_URL: ${{ secrets.SECURITY_GATEWAY_WEBHOOK_URL }}
          SECURITY_GATEWAY_INGRESS_TOKEN: ${{ secrets.SECURITY_GATEWAY_INGRESS_TOKEN }}
          SECURITY_GATEWAY_CA_FILE: ${{ runner.temp }}/security-gateway-ca.pem
          SECURITY_GATEWAY_CLIENT_CERT_FILE: ${{ runner.temp }}/security-gateway-client.crt
          SECURITY_GATEWAY_CLIENT_KEY_FILE: ${{ runner.temp }}/security-gateway-client.key
          SECURITY_EMAIL_WEBHOOK_URL: ${{ secrets.SECURITY_EMAIL_WEBHOOK_URL }}
          SECURITY_EMAIL_WEBHOOK_TOKEN: ${{ secrets.SECURITY_EMAIL_WEBHOOK_TOKEN }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 tooling/notify_security.py \\
            --report unified-report/security-report.json \\
            --workflow-url "$WORKFLOW_URL"
      - name: Enforce Critical policy
        if: steps.evaluate.outputs.critical_count != '0'
        run: |
          echo 'Critical vulnerabilities detected; blocking the quality gate and APK build.'
          exit 1

  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [fast, integration, coverage, prometheus-rules, security, container-security, snyk, security-report, security-notify]
    if: always()
    steps:
      - name: Require all quality jobs to pass
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          PROM_RULES_RESULT: ${{ needs.prometheus-rules.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          CONTAINER_SECURITY_RESULT: ${{ needs.container-security.result }}
          SNYK_RESULT: ${{ needs.snyk.result }}
          SECURITY_REPORT_RESULT: ${{ needs.security-report.result }}
          SECURITY_NOTIFY_RESULT: ${{ needs.security-notify.result }}
        run: |
          set -euo pipefail
          echo "fast=${FAST_RESULT}"
          echo "integration=${INTEGRATION_RESULT}"
          echo "coverage=${COVERAGE_RESULT}"
          echo "prometheus-rules=${PROM_RULES_RESULT}"
          echo "security=${SECURITY_RESULT}"
          echo "container-security=${CONTAINER_SECURITY_RESULT}"
          echo "snyk=${SNYK_RESULT}"
          echo "security-report=${SECURITY_REPORT_RESULT}"
          echo "security-notify=${SECURITY_NOTIFY_RESULT}"
          test "$FAST_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$PROM_RULES_RESULT" = success
          test "$SECURITY_RESULT" = success
          test "$CONTAINER_SECURITY_RESULT" = success
          test "$SNYK_RESULT" = success || test "$SNYK_RESULT" = skipped
          test "$SECURITY_REPORT_RESULT" = success
          test "$SECURITY_NOTIFY_RESULT" = success

  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [quality]
    if: ${{ needs.quality.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --release; then exit 0; fi
            rm -rf android/.gradle android/build android/app/build
            sleep $((attempt * 20))
          done
          exit 1
      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: المحاسب الصوتي ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## المحاسب الصوتي - ${{ github.ref_name }}
            تم اجتياز fast وintegration وcoverage وsecurity قبل بناء APK.
