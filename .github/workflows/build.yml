name: Build Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Install deps
        run: flutter pub get

      - name: Build APK arm64-v8a release
        run: flutter build apk --release

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Smart Accountant ${{ github.ref_name }} - عاقل المحاسبة الخارق
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## ${{ github.ref_name }} - عاقل المحاسبة الخارق v2.0.1
            
            ### الميزات والتحديثات
            - حجم APK مخفف (حوالي 35MB) بدون تضمن نموذج Gemma في الأصل.
            - تحميل نموذج Gemma محلياً تلقائياً عند أول تشغيل باستخدام Dio عبر الإصدارات الرسمية.
            - ضبط minSdkVersion إلى 24 ودعم arm64-v8a.
            
            ### التحميل
            - قم بتنزيل ملف `app-release.apk` وثبته على هاتفك، وسيقوم العاقل بتحميل الملف المطلوب تلقائياً عند الفتح الأول.
