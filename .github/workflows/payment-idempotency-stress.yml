name: Authorized Payment Idempotency CI

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Test profile: smoke or medium'
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - medium
  pull_request:
    paths:
      - 'tooling/payment_idempotency_stress_test.js'
      - 'tooling/redis_idempotency_integration.py'
      - 'tooling/test_*.py'
      - '.github/workflows/payment-idempotency-stress.yml'

permissions:
  contents: read

jobs:
  redis-integration:
    name: Redis lock and key-reuse integration
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Redis client
        run: python -m pip install --disable-pip-version-check 'redis==6.4.0'
      - name: Run isolated Redis integration test
        env:
          REDIS_URL: redis://127.0.0.1:6379/15
          TEST_ID: ci-${{ github.run_id }}
        run: python tooling/redis_idempotency_integration.py

  payment-load:
    name: k6 idempotency load test
    needs: redis-integration
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: staging-security-test
    env:
      PAYMENT_URL: ${{ secrets.STAGING_PAYMENT_URL }}
      PAYMENT_TOKEN: ${{ secrets.STAGING_PAYMENT_TEST_TOKEN }}
      TEST_ID: payment-${{ github.run_id }}
      MAX_RETRIES: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        uses: grafana/setup-k6-action@v1
      - name: Validate protected staging target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAYMENT_URL"
          test -n "$PAYMENT_TOKEN"
          case "$PAYMENT_URL" in
            https://*) ;;
            *) echo 'PAYMENT_URL must use HTTPS' >&2; exit 1 ;;
          esac
          if [[ "$PAYMENT_URL" == *production* || "$PAYMENT_URL" == *prod.* ]]; then
            echo 'Production payment targets are forbidden' >&2
            exit 1
          fi
      - name: Run k6 smoke profile
        if: inputs.profile == 'smoke'
        run: |
          k6 run --summary-export=payment-stress-results.json \
            --vus 2 --duration 20s tooling/payment_idempotency_stress_test.js
      - name: Run k6 medium profile
        if: inputs.profile == 'medium'
        run: |
          k6 run --summary-export=payment-stress-results.json \
            tooling/payment_idempotency_stress_test.js
      - name: Upload redacted k6 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-idempotency-k6-${{ github.run_id }}
          path: payment-stress-results.json
          retention-days: 7
