name: Build Maqani Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.1
          cache: true
          pub-cache: true

      - name: Show tool versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format lib/notification_service.dart lib/sync_service.dart test/sync_service_test.dart integration_test/rls_supabase_test.dart

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run sync unit tests
        run: flutter test --coverage --concurrency=1 test/sync_service_test.dart

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: maqani-coverage-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: coverage/lcov.info

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maqani-apks-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Create build summary
        if: always()
        run: |
          {
            echo '## مقاني Android APK'
            echo ''
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ''
            echo 'تم تنفيذ البناء على قناة Flutter stable. ستجد ملفات APK في قسم Artifacts لهذه المهمة.'
          } >> "$GITHUB_STEP_SUMMARY"
