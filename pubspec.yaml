name: smart_accountant
description: "Smart Accountant - المحاسب الذكي لتسجيل العمليات وحسابات المبيعات والمشتريات والديون مع حاسبة ذكية وتصدير PDF."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Material 3 Pro وواجهة عربية متجاوبة
  material_symbols_icons: ^4.0.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.7
  responsive_framework: ^1.3.2

  # الحالة والتخزين وقاعدة البيانات
  flutter_riverpod: ^2.4.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  drift: ^2.16.2
  # drift_sqlcipher غير منشورة على pub.dev؛ لا يمكن إضافتها كتبعٍ صالح.
  # سيتم إبقاء sqflite العامل، وتقييم SQLCipher عبر مكتبة أصلية موثوقة في مرحلة منفصلة.
  path: ^1.9.0
  path_provider: ^2.1.3
  # الإصدار القديم يستخدم Registrar؛ هذا الإصدار يدعم Flutter embedding الحديث.
  shared_preferences: ^2.5.3
  # الإصدار 9 يتعارض مع flutter_gemma عبر flutter_secure_storage_web القديم.
  flutter_secure_storage: ^10.3.1

  # الذكاء والصوت
  # الإصدار 6 يعتمد Registrar المحذوف؛ الإصدار 7 يدعم Flutter embedding الحديث.
  # Vosk محلي دون خدمة سحابية؛ الإصدار 0.3.5 أو أحدث ضمن سلسلة 0.3.x.
  vosk_flutter: ^0.3.5
  flutter_tts: ^4.0.1
  google_generative_ai: ^0.4.7
  record: ^5.1.1
  # يتطلب PICOVOICE_ACCESS_KEY وملف keyword مخصصاً لعبارة يا محاسب.
  porcupine_flutter: ^3.0.0

  # التقارير والتصدير
  pdf: ^3.10.7
  printing: ^5.11.1
  excel: ^4.0.0
  fl_chart: ^0.67.0

  # خدمات الجهاز والمساعدة
  # الإصدار 6 يستخدم Registrar المحذوف؛ نستخدم إصداراً حديثاً متوافقاً مع Flutter الحالي.
  file_picker: ^8.0.0
  intl: ^0.18.1
  # 5.0.2 يتعارض مع flutter_gemma 0.3.1 عبر حزمة js؛ نستخدم إصداراً متوافقاً مع Flutter الحالي.
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.0.2
  permission_handler: ^10.4.5
  cupertino_icons: ^1.0.6
  open_file: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  fake_async: ^1.3.2
  drift_dev: ^2.16.2
  build_runner: ^2.4.8

dependency_overrides:
  # vosk_flutter 0.3.x يطلب http 0.13.x بينما google_fonts 6.x يطلب http 1.x.
  # هذا override يحتاج تحقق compile؛ إن فشل يلزم fork محدث لـ vosk_flutter.
  http: ^1.5.0
  intl: ^0.18.1
  # record_linux 0.7.2 لا يواكب API 1.6.0؛ تثبيت واجهة 1.2.0 المتوافقة مع record 5.x.
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true
  # نموذج Vosk يُحمّل عند أول تشغيل لتقليل حجم APK؛ لا تُضمّن الحمولة الكبيرة داخل التطبيق.

