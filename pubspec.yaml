name: smart_accountant
description: "Smart Accountant - المحاسب الذكي لتسجيل العمليات وحسابات المبيعات والمشتريات والديون مع حاسبة ذكية وتصدير PDF."
publish_to: 'none'
version: 1.0.5+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  pdf: ^3.10.7
  path_provider: ^2.1.2
  open_file: ^3.3.2
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
