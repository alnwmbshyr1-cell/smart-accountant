name: smart_accountant
description: "Smart Accountant - Flutter accounting app"
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_symbols_icons: ^4.0.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.7
  responsive_framework: ^1.3.2
  flutter_riverpod: ^2.4.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  drift: ^2.16.2
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1
  local_auth: ^2.3.0
  vosk_flutter: ^0.3.5
  flutter_tts: ^4.0.1
  flutter_local_notifications: ^22.3.0
  supabase_flutter: ^2.0.0
  http: ^1.5.0
  timezone: ^0.11.1
  google_generative_ai: ^0.4.7
  record: ^5.1.1
  porcupine_flutter: ^3.0.0
  pdf: ^3.10.7
  printing: ^5.11.1
  excel: ^4.0.0
  fl_chart: ^0.67.0
  file_picker: ^8.0.0
  intl: ^0.18.1
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.0.2
  permission_handler: ^10.4.5
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  fake_async: ^1.3.1
  test: ^1.25.0
  drift_dev: ^2.16.2
  build_runner: ^2.4.8

dependency_overrides:
  permission_handler: ^12.0.1
  http: ^1.5.0
  intl: ^0.18.1
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
